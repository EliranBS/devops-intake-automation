name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Run fixture pipeline
        run: python -m src.intake.pipeline
      - name: Run PowerShell validation script
        shell: pwsh
        run: .\scripts\validate.ps1
      - name: Run PowerShell local demo
        shell: pwsh
        run: .\scripts\run-local-demo.ps1
